<link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />

<style>
  :root {
    /* Colores del chat (vino de tu hoja de cálculo) */
    --chat--color-primary: #7a1428;
    --chat--color-primary-shade-50: #64101f;
    --chat--color-primary-shade-100: #4e0c18;
    --chat--color-secondary: #7a1428;
    --chat--color-secondary-shade-50: #64101f;
    --chat--header--background: #7a1428;
    --chat--header--color: #ffffff;
    --chat--message--user--background: #7a1428;
    --chat--message--user--color: #ffffff;
    --chat--message--bot--background: #f3eef0;
    --chat--message--bot--color: #2a1a1e;
    --chat--border-radius: 12px;
  }

  /* Botón flotante con emoji */
  #libreria-bot-btn {
    position: fixed;
    right: 24px;
    bottom: 24px;
    width: 64px;
    height: 64px;
    border: none;
    border-radius: 50%;
    background: #7a1428;
    color: #fff;
    font-size: 34px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(122, 20, 40, 0.35);
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease;
  }
  #libreria-bot-btn:hover { transform: scale(1.08); }
  #libreria-bot-btn:focus-visible { outline: 3px solid #f2b705; outline-offset: 3px; }

  /* Globo de texto junto al botón */
  #libreria-bot-hint {
    position: fixed;
    right: 98px;
    bottom: 38px;
    background: #ffffff;
    color: #2a1a1e;
    font: 500 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 8px 12px;
    border-radius: 12px 12px 2px 12px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    z-index: 99999;
    white-space: nowrap;
  }

  /* Ventana del chat */
  #libreria-bot-panel {
    position: fixed;
    right: 24px;
    bottom: 100px;
    width: 380px;
    height: 560px;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 130px);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    z-index: 99998;
    display: none;
    background: #fff;
  }
  #libreria-bot-panel.abierto { display: block; }

  @media (max-width: 480px) {
    #libreria-bot-panel { right: 16px; left: 16px; width: auto; bottom: 96px; }
    #libreria-bot-hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #libreria-bot-btn { transition: none; }
  }
</style>

<div id="libreria-bot-panel" role="dialog" aria-label="Chat de la librería"></div>
<span id="libreria-bot-hint">¿Buscas un libro? 📚</span>
<button id="libreria-bot-btn" type="button" aria-label="Abrir chat de la librería" aria-expanded="false">🤖</button>

<script type="module">
  import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

  const btn = document.getElementById('libreria-bot-btn');
  const panel = document.getElementById('libreria-bot-panel');
  const hint = document.getElementById('libreria-bot-hint');
  let chatCreado = false;

  function crearChat() {
    createChat({
      webhookUrl: 'https://jonathaneliel.app.n8n.cloud/webhook/libreria-chat-agente-0001/chat',
      mode: 'fullscreen',
      target: '#libreria-bot-panel',
      showWelcomeScreen: false,
      loadPreviousSession: true,
      chatInputKey: 'chatInput',
      chatSessionKey: 'sessionId',
      defaultLanguage: 'en',
      initialMessages: [
        '¡Hola! 🤖📚 Soy el asistente de la librería.',
        'Puedo ayudarte a buscar libros, darte precios y disponibilidad, y registrar tu pedido. ¿Qué libro estás buscando?'
      ],
      i18n: {
        en: {
          title: 'Asistente de la Librería 🤖',
          subtitle: 'Consulta y compra de libros',
          footer: '',
          getStarted: 'Nueva conversación',
          inputPlaceholder: 'Escribe tu consulta...',
          closeButtonTooltip: 'Cerrar'
        }
      }
    });
    chatCreado = true;
  }

  btn.addEventListener('click', () => {
    const abrir = !panel.classList.contains('abierto');
    if (abrir && !chatCreado) crearChat();
    panel.classList.toggle('abierto', abrir);
    btn.textContent = abrir ? '✖️' : '🤖';
    btn.setAttribute('aria-expanded', String(abrir));
    btn.setAttribute('aria-label', abrir ? 'Cerrar chat' : 'Abrir chat de la librería');
    hint.style.display = abrir ? 'none' : '';
  });
</script>
<!-- ================= FIN CHATBOT LIBRERÍA ================= -->
